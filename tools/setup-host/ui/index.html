<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有谱 安装程序</title>
    <style>
      /* ===================================================================
         有谱 · 安装界面样式
         设计尺寸 960x680(宿主保证客户区 = 该尺寸 × 系统 DPI/96,见 NativeHost.cs)。
         结构:标题栏(拖拽区) / 功能轮播 / 安装配置面板。
         所有资源内联(构建期整份 HTML 被嵌进 exe),离线可用。
         =================================================================== */
      :root {
        /* 中性底:锌灰族(近黑),全站只用这一族中性色,不再混蓝调海军色 */
        --bg-0: #090d1a;
        --bg-1: #0f1526;
        --bg-2: #161c33;
        --panel: rgba(255, 255, 255, 0.045);
        --panel-strong: rgba(255, 255, 255, 0.08);
        --stroke: rgba(255, 255, 255, 0.1);
        --stroke-soft: rgba(255, 255, 255, 0.06);
        --text: #f4f6ff;
        --text-dim: #a6adc8;
        --text-faint: #6e7793;

        /* 唯一强调色:直接取自产品图标 build/icon-preview.png(底色 #090D1A、音符
           白→淡紫、音点 #7460E8)。全站只用这一个色相,深浅代替第二个颜色;
           不再出现绿/青/紫三色霓虹渐变。 */
        --accent: #7460e8;
        --accent-2: #9b8bf2;
        --accent-3: #4c3ab8;
        --accent-cta: #5b46d6;
        --accent-soft: rgba(116, 96, 232, 0.16);
        --accent-line: rgba(116, 96, 232, 0.36);
        --accent-ink: #0a0620;
        --on-accent: #ffffff;

        /* 语义色:只用于状态(失败 / 空间不足 / 离线标记),不参与品牌表达 */
        --danger: #f87171;
        --warn: #f59e0b;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --font:
          'Segoe UI Variable Display', 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei',
          system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-0);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
      }

      body {
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      .svg-defs {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }

      /* ---------------- 背景:极光渐变 + 网格 + 暗角 ---------------- */
      .aurora {
        position: fixed;
        inset: -20%;
        z-index: 0;
        filter: blur(70px);
        opacity: 0.8;
        pointer-events: none;
      }

      .aurora span {
        position: absolute;
        display: block;
        border-radius: 50%;
        mix-blend-mode: screen;
        will-change: transform;
      }

      .aurora .a1 {
        top: 2%;
        left: 0%;
        width: 46%;
        height: 56%;
        background: radial-gradient(circle at 30% 30%, rgba(116, 96, 232, 0.34), transparent 66%);
        animation: drift1 24s ease-in-out infinite;
      }

      .aurora .a2 {
        top: 30%;
        left: 34%;
        width: 54%;
        height: 62%;
        background: radial-gradient(circle at 50% 50%, rgba(76, 58, 184, 0.3), transparent 68%);
        animation: drift2 29s ease-in-out infinite;
      }

      .aurora .a3 {
        top: -10%;
        left: 48%;
        width: 46%;
        height: 52%;
        background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.055), transparent 68%);
        animation: drift3 33s ease-in-out infinite;
      }

      @keyframes drift1 {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(8%, 6%, 0) scale(1.14);
        }
      }

      @keyframes drift2 {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1.06);
        }
        50% {
          transform: translate3d(-9%, -5%, 0) scale(0.95);
        }
      }

      @keyframes drift3 {
        0%,
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(-7%, 9%, 0) scale(1.18);
        }
      }

      .grid-overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        opacity: 0.3;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 0%, transparent 76%);
        mask-image: radial-gradient(circle at 30% 40%, #000 0%, transparent 76%);
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(circle at 50% 40%, transparent 44%, rgba(3, 6, 14, 0.7) 100%);
      }

      /* ---------------- 窗口框架 ---------------- */
      .app {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .titlebar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 52px;
        padding: 0 10px 0 18px;
        cursor: default;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand img {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        object-fit: cover;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      }

      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        min-width: 0;
      }

      .brand-name {
        font-size: 13.5px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .brand-sub {
        color: var(--text-faint);
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .brand-ver {
        margin-left: 2px;
        padding: 2px 8px;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text-faint);
        font-size: 10.5px;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }

      .brand-ver[hidden] {
        display: none;
      }

      .win-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .win-btn {
        display: grid;
        place-items: center;
        width: 38px;
        height: 30px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text-dim);
        cursor: pointer;
        transition:
          background 0.16s ease,
          color 0.16s ease;
      }

      .win-btn:hover {
        background: var(--panel-strong);
        color: var(--text);
      }

      .win-btn.is-close:hover {
        background: #e81123;
        color: #fff;
      }

      .win-btn svg {
        width: 11px;
        height: 11px;
      }

      /* ---------------- 视图容器 ---------------- */
      .view {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .view[hidden] {
        display: none !important;
      }

      #viewSetup {
        padding: 0 18px 16px;
        gap: 12px;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .anim-up {
        animation: fadeUp 0.6s var(--ease) both;
      }

      /* ---------------- 功能轮播 ---------------- */
      .carousel {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 14px 16px 10px;
        border: 1px solid var(--stroke);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.022));
        box-shadow:
          0 22px 54px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      .carousel::after {
        /* 卡片顶部的一道高光,增强玻璃质感 */
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
      }

      .carousel-viewport {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }

      .slide {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 26px;
        opacity: 0;
        transform: translateX(0) scale(0.985);
        transition:
          opacity 0.62s var(--ease),
          transform 0.62s var(--ease);
        pointer-events: none;
        will-change: opacity, transform;
      }

      .slide.is-active {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }

      .carousel.dir-next .slide:not(.is-active) {
        transform: translateX(38px) scale(0.97);
      }

      .carousel.dir-prev .slide:not(.is-active) {
        transform: translateX(-38px) scale(0.97);
      }

      .carousel.dir-next .slide.is-out {
        transform: translateX(-30px) scale(0.97);
      }

      .carousel.dir-prev .slide.is-out {
        transform: translateX(30px) scale(0.97);
      }

      .carousel.no-anim .slide {
        transition: none !important;
      }

      /* 非当前页的动画全部暂停:六幕同时跑会白白吃掉 GPU */
      .slide:not(.is-active) * {
        animation-play-state: paused !important;
      }

      .slide-art {
        flex: 0 0 auto;
        width: 400px;
        height: 218px;
      }

      .slide-copy {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 430px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .slide-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-faint);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .slide-meta b {
        color: var(--accent-2);
        font-weight: 620;
        font-variant-numeric: tabular-nums;
      }

      .slide-meta .rule {
        width: 26px;
        height: 1px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.32), transparent);
      }

      .slide-title {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.24;
        color: var(--text);
      }

      .slide-desc {
        color: var(--text-dim);
        font-size: 13px;
        max-width: 26em;
      }

      .carousel-nav {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
      }

      .carousel-dots {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dot {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        transition:
          width 0.36s var(--ease),
          background 0.26s ease;
      }

      .dot:hover {
        background: rgba(255, 255, 255, 0.36);
      }

      .dot.is-active {
        width: 20px;
        background: var(--accent);
      }

      .carousel-progress {
        flex: 1 1 auto;
        height: 2px;
        margin: 0 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .carousel-progress i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: 0 50%;
      }

      .nav-btn {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid var(--stroke);
        border-radius: 50%;
        background: var(--panel);
        color: var(--text-dim);
        cursor: pointer;
        transition:
          background 0.18s ease,
          color 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease;
      }

      .nav-btn:hover {
        background: var(--panel-strong);
        border-color: rgba(255, 255, 255, 0.22);
        color: var(--text);
      }

      .nav-btn:active {
        transform: scale(0.94);
      }

      .nav-btn svg {
        width: 13px;
        height: 13px;
      }

      /* ---------------- SVG 场景:公共 ---------------- */
      .scene {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .sc-card {
        fill: url(#ypGlass);
      }

      .sc-card-line {
        fill: none;
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 1;
      }

      .sc-bloom {
        fill: url(#ypGlow);
        opacity: 0.34;
      }

      .sc-fg {
        fill: rgba(244, 246, 255, 0.38);
      }

      .sc-fg-dim {
        fill: rgba(244, 246, 255, 0.22);
      }

      /* ---------------- 场景 1:在线播放 ---------------- */
      .sc-float {
        animation: scFloat 5.4s ease-in-out infinite;
      }

      @keyframes scFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      .sc-art {
        fill: url(#ypLine);
      }

      .sc-sweep {
        fill: url(#ypSweep);
        transform: skewX(-16deg);
        animation: scSweep 3.8s ease-in-out infinite;
      }

      @keyframes scSweep {
        0% {
          transform: translateX(0) skewX(-16deg);
        }
        55%,
        100% {
          transform: translateX(210px) skewX(-16deg);
        }
      }

      .sc-note path,
      .sc-note circle {
        fill: none;
        stroke: #0a0620;
        stroke-width: 4.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.8;
      }

      .sc-playbtn {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: scPulse 2.9s ease-in-out infinite;
      }

      .sc-playbtn circle {
        fill: rgba(255, 255, 255, 0.07);
        stroke: rgba(255, 255, 255, 0.16);
      }

      .sc-playglyph {
        fill: var(--accent-2);
      }

      @keyframes scPulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.09);
          opacity: 1;
        }
      }

      .eq {
        fill: url(#ypLineSoft);
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: eqBar 1.75s ease-in-out infinite;
        animation-delay: var(--d, 0s);
      }

      @keyframes eqBar {
        0%,
        100% {
          transform: scaleY(0.24);
          opacity: 0.5;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .sc-track,
      .sc-cache,
      .sc-chip,
      .sc-chip2 {
        fill: rgba(255, 255, 255, 0.09);
      }

      .sc-trackfill,
      .sc-cache-fill,
      .sc-upfill {
        fill: url(#ypLineSoft);
        transform-box: fill-box;
        transform-origin: 0% 50%;
      }

      .sc-trackfill {
        animation: fillGrow 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .sc-dot {
        fill: #fafafa;
        animation: dotTravel 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes fillGrow {
        0% {
          transform: scaleX(0.03);
        }
        100% {
          transform: scaleX(1);
        }
      }

      @keyframes dotTravel {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(176px);
        }
      }

      /* ---------------- 场景 2:沉浸歌词 ---------------- */
      .ly {
        fill: rgba(244, 246, 255, 0.2);
        animation: lyWave 6s ease-in-out infinite;
        animation-delay: calc(var(--i, 0) * 0.16s);
      }

      @keyframes lyWave {
        0%,
        100% {
          opacity: 0.72;
        }
        46% {
          opacity: 1;
        }
      }

      .ly-active {
        fill: url(#ypLine);
        opacity: 0.95;
        animation: none;
      }

      .ly-glow {
        fill: url(#ypGlow);
        opacity: 0.42;
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: lyGlow 4.8s ease-in-out infinite;
      }

      @keyframes lyGlow {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.5;
        }
      }

      .ly-stack {
        animation: lyDrift 7s ease-in-out infinite;
      }

      @keyframes lyDrift {
        0%,
        100% {
          transform: translateY(3px);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      .ly-sweep {
        fill: url(#ypSweep);
        animation: lySweep 3.4s ease-in-out infinite;
      }

      @keyframes lySweep {
        0% {
          transform: translateX(0);
        }
        62%,
        100% {
          transform: translateX(360px);
        }
      }

      .ly-playhead rect {
        fill: rgba(116, 96, 232, 0.35);
      }

      .ly-playhead circle {
        fill: var(--accent);
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: scPulse 2.4s ease-in-out infinite;
      }

      /* ---------------- 场景 3:桌面体验 ---------------- */
      .sc-win {
        fill: rgba(255, 255, 255, 0.055);
        stroke: rgba(255, 255, 255, 0.2);
        stroke-width: 1.4;
      }

      .sc-win-line {
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 1.4;
      }

      .sc-dotr {
        fill: rgba(255, 255, 255, 0.3);
      }

      .sc-side {
        fill: rgba(255, 255, 255, 0.07);
      }

      .sc-cover {
        fill: url(#ypLine);
        opacity: 0.26;
      }

      .sc-window {
        animation: scFloat 6.2s ease-in-out infinite;
      }

      .sc-mini {
        fill: rgba(10, 16, 32, 0.94);
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1.2;
      }

      .sc-miniart {
        fill: url(#ypLine);
      }

      .sc-float-slow {
        animation: miniRise 5.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      @keyframes miniRise {
        0% {
          transform: translateY(20px);
          opacity: 0;
        }
        16% {
          transform: translateY(0);
          opacity: 1;
        }
        80% {
          transform: translateY(0);
          opacity: 1;
        }
        94%,
        100% {
          transform: translateY(16px);
          opacity: 0;
        }
      }

      .sc-minictl circle {
        fill: rgba(116, 96, 232, 0.9);
      }

      .sc-minibtn {
        fill: rgba(255, 255, 255, 0.26);
      }

      .sc-tray-ring {
        fill: none;
        stroke: rgba(116, 96, 232, 0.62);
        stroke-width: 1.6;
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: trayPulse 2.8s ease-out infinite;
      }

      @keyframes trayPulse {
        0% {
          transform: scale(0.72);
          opacity: 0.9;
        }
        70%,
        100% {
          transform: scale(1.28);
          opacity: 0;
        }
      }

      .sc-tray-box {
        fill: rgba(255, 255, 255, 0.09);
        stroke: rgba(255, 255, 255, 0.24);
        stroke-width: 1.2;
      }

      .sc-tray-mark {
        fill: none;
        stroke: var(--accent-2);
        stroke-width: 2.2;
        stroke-linecap: round;
      }

      .sc-tray-note {
        fill: var(--accent-2);
      }

      /* ---------------- 场景 4:离线缓存 ---------------- */
      .sc-ring-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 9;
      }

      /* 循环终点用淡出收尾,避免每轮开头出现"空环"的硬切 */
      .sc-ring-bar {
        fill: none;
        stroke: url(#ypLine);
        stroke-width: 9;
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 118px 96px;
        animation: ringDraw 4.6s ease-in-out infinite;
      }

      @keyframes ringDraw {
        0% {
          stroke-dashoffset: 238.8;
          opacity: 1;
        }
        56% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        84% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        94%,
        100% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
      }

      .sc-arrow path {
        fill: none;
        stroke: rgba(255, 255, 255, 0.75);
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sc-arrow {
        animation: arrowDrop 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes arrowDrop {
        0% {
          transform: translateY(-8px);
          opacity: 0;
        }
        16% {
          opacity: 1;
        }
        52% {
          transform: translateY(7px);
          opacity: 1;
        }
        70%,
        100% {
          transform: translateY(10px);
          opacity: 0;
        }
      }

      .sc-check {
        transform-box: view-box;
        transform-origin: 118px 96px;
        opacity: 0;
        animation: checkPop 4.6s ease-out infinite;
      }

      .sc-check circle {
        fill: rgba(116, 96, 232, 0.16);
        stroke: rgba(116, 96, 232, 0.6);
        stroke-width: 1.6;
      }

      .sc-check path {
        fill: none;
        stroke: var(--accent-2);
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes checkPop {
        0%,
        58% {
          transform: scale(0.45);
          opacity: 0;
        }
        66% {
          transform: scale(1.12);
          opacity: 1;
        }
        76% {
          transform: scale(1);
          opacity: 1;
        }
        92% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 0;
        }
      }

      .sc-cloud path {
        fill: none;
        stroke: rgba(244, 246, 255, 0.38);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sc-cloud-slash {
        stroke: rgba(245, 158, 11, 0.8) !important;
      }

      .sc-cloud {
        animation: scFloat 5.8s ease-in-out infinite;
      }

      .sc-cache-fill {
        animation: fillGrow 4.6s ease-in-out infinite;
      }

      /* ---------------- 场景 5:外观随心 ---------------- */
      .sc-coverbase {
        fill: rgba(255, 255, 255, 0.05);
      }

      .sc-covernote path,
      .sc-covernote circle {
        fill: none;
        stroke: rgba(4, 24, 14, 0.5);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sc-tint {
        opacity: 0;
        animation: tintCycle 5.4s ease-in-out infinite;
      }

      .sc-tint.t1 {
        fill: #9b8bf2;
      }

      .sc-tint.t2 {
        fill: #7460e8;
        animation-delay: 1.8s;
      }

      .sc-tint.t3 {
        fill: #4c3ab8;
        animation-delay: 3.6s;
      }

      @keyframes tintCycle {
        0% {
          opacity: 1;
        }
        30% {
          opacity: 1;
        }
        44%,
        86% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .sc-tint-sweep {
        fill: url(#ypSweep);
        transform: skewX(-16deg);
        animation: scSweep 4.6s ease-in-out infinite;
      }

      .sc-swatch {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: swatchPop 2.7s ease-in-out infinite;
        animation-delay: var(--d, 0s);
      }

      @keyframes swatchPop {
        0%,
        100% {
          transform: scale(1);
        }
        38% {
          transform: scale(1.13);
        }
      }

      .sw0 circle {
        stroke: #9b8bf2;
      }

      .sw1 circle {
        stroke: var(--accent-2);
      }

      .sw2 circle {
        stroke: var(--accent-3);
      }

      .sc-swatch circle {
        fill: rgba(255, 255, 255, 0.04);
        stroke-width: 2.4;
      }

      .sc-swatch-face {
        fill: rgba(10, 16, 32, 0.5);
        stroke: none !important;
      }

      .sc-swatch-tick {
        fill: none;
        stroke: rgba(244, 246, 255, 0.8);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sc-accentbar {
        fill: rgba(255, 255, 255, 0.07);
      }

      .sc-accentfill {
        opacity: 0;
        animation: tintCycle 5.4s ease-in-out infinite;
      }

      .sc-accentfill.af1 {
        fill: url(#ypLine);
      }

      .sc-accentfill.af2 {
        fill: url(#ypLineAlt);
        animation-delay: 1.8s;
      }

      .sc-accentfill.af3 {
        fill: url(#ypLineWarm);
        animation-delay: 3.6s;
      }

      /* ---------------- 场景 6:自动更新 ---------------- */
      .sc-refresh {
        transform-origin: 128px 92px;
        animation: spinSnap 3.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes spinSnap {
        0% {
          transform: rotate(0deg);
        }
        58%,
        100% {
          transform: rotate(360deg);
        }
      }

      .sc-refresh-track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 8;
      }

      .sc-refresh-arc {
        fill: none;
        stroke: url(#ypLine);
        stroke-width: 8;
        stroke-linecap: round;
      }

      .sc-refresh-tip {
        fill: var(--accent-2);
      }

      .sc-spark {
        fill: var(--accent-2);
        opacity: 0;
        transform-box: view-box;
        transform-origin: 128px 92px;
        animation: sparkBurst 3.8s ease-out infinite;
        animation-delay: var(--d, 0s);
      }

      @keyframes sparkBurst {
        0%,
        58% {
          transform: scale(0.3);
          opacity: 0;
        }
        66% {
          opacity: 0.95;
        }
        84% {
          transform: scale(1.85);
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }

      .sc-upcheck {
        transform-box: view-box;
        transform-origin: 128px 92px;
        opacity: 0;
        animation: checkPop 3.8s ease-out infinite;
      }

      .sc-upcheck circle {
        fill: rgba(116, 96, 232, 0.14);
        stroke: rgba(116, 96, 232, 0.55);
        stroke-width: 1.6;
      }

      .sc-upcheck path {
        fill: none;
        stroke: var(--accent-2);
        stroke-width: 3.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sc-upfill {
        animation: fillGrow 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .sc-chip-dot {
        fill: var(--accent-2);
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: scPulse 2.2s ease-in-out infinite;
      }

      /* ---------------- 安装配置面板 ---------------- */
      .panel {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        padding: 14px 16px;
        border: 1px solid var(--stroke);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.022));
        box-shadow:
          0 18px 44px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-title {
        font-size: 13.5px;
        font-weight: 640;
      }

      .pill {
        padding: 3px 9px;
        border-radius: 999px;
        background: rgba(116, 96, 232, 0.14);
        border: 1px solid rgba(116, 96, 232, 0.32);
        color: var(--accent-2);
        font-size: 11px;
      }

      .field-label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 10px;
        color: var(--text-dim);
        font-size: 12px;
      }

      .field-hint {
        color: var(--text-faint);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 46%;
      }

      .path-row {
        display: flex;
        gap: 6px;
        margin-top: 7px;
      }

      .path-input {
        flex: 1 1 auto;
        min-width: 0;
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--stroke);
        border-radius: 10px;
        background: rgba(6, 10, 20, 0.6);
        color: var(--text);
        font-family: var(--font);
        font-size: 12.5px;
        text-overflow: ellipsis;
        outline: none;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .path-input:focus {
        border-color: rgba(116, 96, 232, 0.6);
        box-shadow: 0 0 0 3px rgba(116, 96, 232, 0.14);
      }

      .path-input.is-invalid {
        border-color: rgba(248, 113, 113, 0.7);
        box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.14);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 36px;
        padding: 0 13px;
        border: 1px solid var(--stroke);
        border-radius: 10px;
        background: var(--panel-strong);
        color: var(--text);
        font-family: var(--font);
        font-size: 12.5px;
        font-weight: 560;
        cursor: pointer;
        white-space: nowrap;
        transition:
          transform 0.16s ease,
          background 0.18s ease,
          border-color 0.18s ease;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-ghost {
        background: transparent;
      }

      .disk-meter {
        margin-top: 9px;
      }

      .disk-bar {
        position: relative;
        height: 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }

      .disk-bar i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.32);
        transition:
          width 0.55s var(--ease),
          background 0.3s ease;
      }

      .disk-bar.is-low i {
        background: linear-gradient(90deg, #f59e0b, var(--danger));
      }

      .disk-text {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 6px;
        color: var(--text-faint);
        font-size: 11px;
      }

      .disk-text b {
        color: var(--text-dim);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .disk-text .warn {
        color: #fca5a5;
      }

      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--stroke-soft);
      }

      .check {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 4px 8px 4px 6px;
        border-radius: 9px;
        cursor: pointer;
        transition: background 0.18s ease;
      }

      .check:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .check input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .check .box {
        position: relative;
        flex: 0 0 auto;
        width: 17px;
        height: 17px;
        border: 1.5px solid rgba(255, 255, 255, 0.28);
        border-radius: 5px;
        background: rgba(6, 10, 20, 0.5);
        transition:
          border-color 0.18s ease,
          background 0.18s ease;
      }

      .check .box::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 5px;
        width: 4px;
        height: 7px;
        border-right: 2px solid #0a0620;
        border-bottom: 2px solid #0a0620;
        transform: rotate(42deg) scale(0);
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .check input:checked + .box {
        border-color: var(--accent);
        background: var(--accent);
      }

      .check input:checked + .box::after {
        transform: rotate(42deg) scale(1);
      }

      .check input:focus-visible + .box {
        box-shadow: 0 0 0 3px rgba(116, 96, 232, 0.24);
      }

      .check-text {
        font-size: 12.5px;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
      }

      .legal {
        flex: 1 1 auto;
        min-width: 0;
        color: var(--text-faint);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .legal b {
        color: var(--text-dim);
        font-weight: 560;
      }

      .btn-primary {
        position: relative;
        flex: 0 0 auto;
        min-width: 148px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        overflow: hidden;
        background: var(--accent-cta);
        color: var(--on-accent);
        font-size: 14px;
        font-weight: 680;
        letter-spacing: 0.02em;
        box-shadow: 0 12px 28px rgba(91, 70, 214, 0.34);
      }

      .btn-primary:hover {
        filter: brightness(1.06);
      }

      .btn-primary::after {
        content: '';
        position: absolute;
        top: 0;
        left: -60%;
        width: 45%;
        height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
        transform: skewX(-18deg);
        animation: sheen 3.8s ease-in-out infinite;
      }

      .btn-primary:disabled {
        opacity: 0.72;
        cursor: default;
      }

      .btn-primary:disabled::after {
        animation: none;
      }

      @keyframes sheen {
        0% {
          left: -60%;
        }
        55%,
        100% {
          left: 130%;
        }
      }

      /* ---------------- 进度视图 ---------------- */
      #viewProgress,
      #viewResult {
        align-items: center;
        justify-content: center;
        padding: 8px 60px 34px;
        text-align: center;
      }

      .ring {
        position: relative;
        width: 158px;
        height: 158px;
      }

      .ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .ring .track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.09);
        stroke-width: 8;
      }

      .ring .bar {
        fill: none;
        stroke: url(#ringGradient);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 452.39;
        stroke-dashoffset: 452.39;
      }

      .ring-core {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }

      .ring-percent {
        font-size: 36px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .ring-percent small {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-dim);
      }

      .ring-stage {
        color: var(--text-dim);
        font-size: 12px;
      }

      .progress-title {
        margin-top: 24px;
        font-size: 19px;
        font-weight: 640;
      }

      .progress-note {
        margin-top: 8px;
        max-width: 30em;
        color: var(--text-dim);
        font-size: 12.5px;
      }

      .steps {
        display: flex;
        gap: 18px;
        margin-top: 24px;
      }

      .step {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text-faint);
        font-size: 12px;
        transition: color 0.3s ease;
      }

      .step .pip {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        transition:
          background 0.3s ease,
          box-shadow 0.3s ease;
      }

      .step.is-active {
        color: var(--text);
      }

      .step.is-active .pip {
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(116, 96, 232, 0.16);
        animation: pipPulse 1.8s ease-in-out infinite;
      }

      .step.is-done .pip {
        background: var(--accent-2);
      }

      @keyframes pipPulse {
        0%,
        100% {
          box-shadow: 0 0 0 3px rgba(116, 96, 232, 0.14);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(116, 96, 232, 0.03);
        }
      }

      /* ---------------- 完成 / 失败视图 ---------------- */
      .result-icon {
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 1px solid rgba(116, 96, 232, 0.4);
        background: radial-gradient(circle at 50% 40%, rgba(116, 96, 232, 0.32), transparent 68%);
        color: var(--accent-2);
      }

      .result-icon svg {
        width: 40px;
        height: 40px;
      }

      .result-icon.is-failed {
        border-color: rgba(248, 113, 113, 0.45);
        background: radial-gradient(circle at 50% 40%, rgba(248, 113, 113, 0.3), transparent 68%);
        color: #fca5a5;
      }

      .result-title {
        margin-top: 20px;
        font-size: 22px;
        font-weight: 680;
      }

      .result-note {
        margin-top: 10px;
        max-width: 30em;
        color: var(--text-dim);
        font-size: 13px;
      }

      .result-path {
        margin-top: 14px;
        padding: 7px 13px;
        border: 1px solid var(--stroke-soft);
        border-radius: 9px;
        background: rgba(6, 10, 20, 0.55);
        color: var(--text-dim);
        font-size: 12px;
        word-break: break-all;
      }

      .result-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }

      /* ---------------- 彩带 ---------------- */
      .confetti {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        overflow: hidden;
      }

      .confetti i {
        position: absolute;
        top: -12px;
        width: 7px;
        height: 13px;
        border-radius: 2px;
        opacity: 0.95;
        will-change: transform, opacity;
        animation: confetti-fall var(--dur, 3s) cubic-bezier(0.3, 0.7, 0.5, 1) var(--delay, 0s) both;
      }

      @keyframes confetti-fall {
        from {
          transform: translate3d(0, 0, 0) rotate(0deg);
          opacity: 1;
        }
        to {
          transform: translate3d(var(--drift, 0px), 105vh, 0) rotate(var(--spin, 320deg));
          opacity: 0.15;
        }
      }

      /* ---------------- 兜底:窗口比设计尺寸更小时 ---------------- */
      @media (max-width: 860px), (max-height: 620px) {
        #viewSetup {
          padding: 0 12px 12px;
        }

        .carousel {
          padding: 12px 12px 8px;
        }

        .slide {
          gap: 12px;
        }

        .slide-art {
          width: 280px;
          height: 168px;
        }

        .slide-title {
          font-size: 20px;
        }

        .carousel-nav {
          margin-top: 6px;
        }

        .options {
          gap: 2px 10px;
        }

        .legal {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="a1"></span><span class="a2"></span><span class="a3"></span>
    </div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <!-- 共享渐变:所有场景通过 url(#id) 引用,避免每个场景各写一份 -->
    <svg class="svg-defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="ypLine" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9b8bf2" />
          <stop offset="55%" stop-color="#7460e8" />
          <stop offset="100%" stop-color="#4c3ab8" />
        </linearGradient>
        <linearGradient id="ypLineSoft" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#b3a6f5" />
          <stop offset="100%" stop-color="#6c56e0" />
        </linearGradient>
        <linearGradient id="ypLineAlt" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7460e8" />
          <stop offset="100%" stop-color="#3c2d94" />
        </linearGradient>
        <linearGradient id="ypLineWarm" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#d9d3fb" />
          <stop offset="100%" stop-color="#7460e8" />
        </linearGradient>
        <linearGradient id="ypGlass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.07)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0.015)" />
        </linearGradient>
        <linearGradient id="ypSweep" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,255,255,0)" />
          <stop offset="50%" stop-color="rgba(255,255,255,0.5)" />
          <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </linearGradient>
        <radialGradient id="ypGlow">
          <stop offset="0%" stop-color="rgba(116,96,232,0.36)" />
          <stop offset="100%" stop-color="rgba(116,96,232,0)" />
        </radialGradient>
        <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9b8bf2" />
          <stop offset="55%" stop-color="#7460e8" />
          <stop offset="100%" stop-color="#4c3ab8" />
        </linearGradient>
      </defs>
    </svg>

    <div class="app">
      <header class="titlebar" id="titlebar">
        <div class="brand">
          <img id="brandLogo" alt="有谱" />
          <div class="brand-text">
            <span class="brand-name" id="brandName">有谱</span>
            <span class="brand-sub" id="brandSub">YOUPU SETUP</span>
          </div>
          <span class="brand-ver" id="brandVer" hidden></span>
        </div>
        <div class="win-actions">
          <button class="win-btn" id="btnMin" type="button" aria-label="最小化" title="最小化">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <rect x="1" y="5.4" width="10" height="1.2" fill="currentColor" />
            </svg>
          </button>
          <button
            class="win-btn is-close"
            id="btnClose"
            type="button"
            aria-label="关闭"
            title="关闭"
          >
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M1.6 1.6 10.4 10.4M10.4 1.6 1.6 10.4"
                stroke="currentColor"
                stroke-width="1.3"
                fill="none"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- ================= 阶段 1:选项 ================= -->
      <main class="view" id="viewSetup">
        <section class="carousel" id="carousel">
          <div class="carousel-viewport" id="carouselViewport"></div>
          <div class="carousel-nav">
            <div class="carousel-dots" id="carouselDots"></div>
            <div class="carousel-progress"><i id="carouselProgress"></i></div>
            <button class="nav-btn" id="carouselPrev" type="button" aria-label="上一个">
              <svg viewBox="0 0 14 14" aria-hidden="true">
                <path
                  d="M8.8 2.6 4.4 7l4.4 4.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button class="nav-btn" id="carouselNext" type="button" aria-label="下一个">
              <svg viewBox="0 0 14 14" aria-hidden="true">
                <path
                  d="M5.2 2.6 9.6 7l-4.4 4.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </section>

        <section class="panel anim-up" style="animation-delay: 0.16s">
          <div class="panel-head">
            <span class="panel-title" id="cardTitle">安装</span>
            <span class="pill" id="updatePill" hidden>升级安装</span>
          </div>

          <div class="field-label">
            <span id="labelDir">安装位置</span>
            <span class="field-hint" id="dirHint"></span>
          </div>
          <div class="path-row">
            <input class="path-input" id="installDir" spellcheck="false" autocomplete="off" />
            <button class="btn" id="btnBrowse" type="button">浏览</button>
            <button class="btn btn-ghost" id="btnReset" type="button">恢复默认</button>
          </div>

          <div class="disk-meter">
            <div class="disk-bar" id="diskBar"><i id="diskFill"></i></div>
            <div class="disk-text">
              <span><span id="labelRequired">需要空间</span> <b id="diskRequired">—</b></span>
              <span><span id="labelAvailable">可用空间</span> <b id="diskAvailable">—</b></span>
              <span class="warn" id="diskWarn" hidden>空间不足</span>
            </div>
          </div>

          <div class="options">
            <label class="check">
              <input type="checkbox" id="optDesktop" checked />
              <span class="box"></span>
              <span class="check-text" id="labelDesktop">创建桌面快捷方式</span>
            </label>
            <label class="check">
              <input type="checkbox" id="optStartMenu" checked />
              <span class="box"></span>
              <span class="check-text" id="labelStartMenu">创建开始菜单快捷方式</span>
            </label>
            <label class="check">
              <input type="checkbox" id="optLaunch" checked />
              <span class="box"></span>
              <span class="check-text" id="labelLaunch">安装完成后启动有谱</span>
            </label>
          </div>

          <div class="footer">
            <p class="legal" id="legal">
              安装到 <b id="legalPath">本机用户目录</b> · 不会收集你的任何数据
            </p>
            <button class="btn" id="btnCancel" type="button">取消</button>
            <button class="btn btn-primary" id="btnInstall" type="button">开始安装</button>
          </div>
        </section>
      </main>

      <!-- ================= 阶段 2:进度 ================= -->
      <main class="view" id="viewProgress" hidden>
        <div class="ring">
          <svg viewBox="0 0 168 168">
            <circle class="track" cx="84" cy="84" r="72" />
            <circle class="bar" id="ringBar" cx="84" cy="84" r="72" />
          </svg>
          <div class="ring-core">
            <div class="ring-percent"><span id="percentValue">0</span><small>%</small></div>
            <div class="ring-stage" id="ringStage">正在准备安装</div>
          </div>
        </div>

        <h2 class="progress-title" id="progressTitle">正在安装 有谱</h2>
        <p class="progress-note" id="progressNote">
          正在写入程序文件,请不要关闭窗口。安装完成后会自动为你打开。
        </p>

        <div class="steps" id="steps">
          <div class="step is-active"><span class="pip"></span><span>准备</span></div>
          <div class="step"><span class="pip"></span><span>写入文件</span></div>
          <div class="step"><span class="pip"></span><span>创建快捷方式</span></div>
          <div class="step"><span class="pip"></span><span>完成</span></div>
        </div>
      </main>

      <!-- ================= 阶段 3:完成 / 失败 ================= -->
      <main class="view" id="viewResult" hidden>
        <div class="result-icon" id="resultIcon">
          <svg viewBox="0 0 48 48" id="resultGlyph" aria-hidden="true">
            <path
              d="M13 25.5 20.5 33 35 16.5"
              fill="none"
              stroke="currentColor"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h2 class="result-title" id="resultTitle">安装完成</h2>
        <p class="result-note" id="resultNote">已经可以使用了,祝你听歌愉快。</p>
        <div class="result-path" id="resultPath" hidden></div>
        <div class="result-actions">
          <button class="btn" id="btnSecondary" type="button" hidden>返回重试</button>
          <button
            class="btn btn-primary"
            id="btnPrimary"
            type="button"
            style="min-width: 0; padding: 0 26px"
          >
            完成
          </button>
        </div>
      </main>
    </div>

    <script>
      /*__YOUPU_SETUP_SCRIPT__*/
    </script>
  </body>
</html>
